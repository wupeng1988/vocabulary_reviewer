spring:
  datasource:
    url: jdbc:h2:~/worddb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
  mvc:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"

server:
  port: 8080
