# ============================================================
#  Word Review Pro 配置文件
#
#  【怎么改端口】
#    把下面 server.port=  等号后面的 8080 改成别的端口号，
#    保存文件，然后关闭程序重新启动，就生效了。
#
#    例： server.port=8081
#
#    改完之后浏览器地址也要跟着改，比如：
#        http://localhost:8081
#
#  【注意】
#    · 格式必须是  server.port=数字   （等号前后不要加空格）
#    · 端口范围 1 ~ 65535，建议用 8081、8082、8888 这类不常用的
#    · 改之前先确认新端口没被别的软件占用
#
#  【其他】
#    程序数据存在家目录的 worddb.mv.db，与端口无关，改端口不会丢数据。
# ============================================================

server.port=8080
